name: deploy-cf-pages

# Builds the NoorJyoti React/Vite SPA (artifacts/web) and deploys to CF Pages.
# Custom domain: noorjyoti.org
# Uses pnpm workspace — install from repo root, build with --filter @workspace/web.

on:
  push:
    branches: [main]
    paths:
      - "artifacts/web/src/**"
      - "artifacts/web/public/**"
      - "artifacts/web/index.html"
      - "artifacts/web/vite.config.ts"
      - "artifacts/web/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cf-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cf-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "9" }

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }

      - name: Install dependencies (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build Vite SPA
        run: pnpm --filter @workspace/web run build
        env:
          NODE_ENV: production
          BASE_PATH: /
          PORT: "3000"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6f0f81ab6245bad1f761e47799179ffe"
          command: pages deploy artifacts/web/dist/public --project-name=noorjyoti
